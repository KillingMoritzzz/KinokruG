<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кинокружок</title>
<style>
:root{--bg:#14151c;--card:#1d1f2b;--line:#2c2f42;--text:#eceef8;--muted:#9a9eb8;--accent:#7983f5;--imdb:#f5c518;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 56px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:6px}
h1{margin:0;font:700 30px/1.1 "Iowan Old Style","Palatino Linotype",Georgia,serif}
.sub{color:var(--muted);margin:6px 0 18px}
.btn{font:inherit;font-weight:600;color:#fff;background:var(--accent);border:0;border-radius:8px;padding:9px 16px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:400}
.who{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:14px}
.who a{color:var(--muted)}
.msg{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px;margin-bottom:16px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
select,input{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.admin{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:12px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.admin input,.admin textarea{flex:1;min-width:220px}
.admin textarea{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.card{display:grid;grid-template-columns:96px 1fr;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.poster{width:96px;aspect-ratio:2/3;object-fit:cover;border-radius:6px;background:var(--line)}
.card h2{margin:0;font:700 18px/1.25 "Iowan Old Style","Palatino Linotype",Georgia,serif}
.year{color:var(--muted);font-size:13px;margin-bottom:8px}
.scores{display:flex;gap:8px;margin-bottom:10px}
.s{flex:1;border-radius:8px;padding:6px 8px;text-align:center}
.s b{display:block;font-size:22px;line-height:1.1}
.s small{font-size:12px}
.s.imdb{background:var(--imdb);color:#1b1c28}
.s.srv{background:var(--accent);color:#fff}
.vote{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.vote button{font:inherit;padding:7px 0;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:6px;cursor:pointer}
.vote button:hover:not(:disabled){border-color:var(--accent)}
.vote button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.vote button:disabled{opacity:.4;cursor:default}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.del{background:none;border:0;color:var(--muted);font-size:12px;cursor:pointer;padding:0;margin-top:4px;text-decoration:underline}
.empty{color:var(--muted);padding:40px 0;text-align:center}

body{background:#0f1014;overflow-x:hidden}
.wrap{position:relative;z-index:1;margin:24px auto;padding:24px 24px 56px;background:rgba(15,16,20,.92);border-radius:16px;backdrop-filter:blur(6px)}
@media (max-width:900px){.wrap{margin:0;border-radius:0;padding:18px 14px 48px}}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#wall{position:fixed;inset:0;z-index:0;overflow:hidden;opacity:.5;transition:opacity .4s;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none}
#wall.drag{cursor:grabbing}
body.wallmode #wall{opacity:1;touch-action:none}
body.wallmode .wrap{display:none}
.wall-in{position:absolute;left:0;top:0;will-change:transform}
.wcol{position:absolute;top:0;will-change:transform}
.strip{display:flex;flex-direction:column;gap:12px}
.p{position:relative;display:block;flex:none;border-radius:6px;overflow:hidden;background:#1d1f2b}
.p img{display:block;width:100%;height:100%;object-fit:cover;-webkit-user-drag:none}
.p .nop{display:flex;height:100%;align-items:center;justify-content:center;padding:14px;text-align:center;color:var(--muted);font:700 18px/1.25 "Iowan Old Style","Palatino Linotype",Georgia,serif}
.p .cap{position:absolute;left:0;right:0;bottom:0;padding:30px 10px 9px;font-size:12px;line-height:1.35;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.88));opacity:0;transition:opacity .2s}
.p:hover .cap,.p:focus-visible .cap{opacity:1}
.p:focus-visible{outline:2px solid var(--accent)}
#wallui{display:none;position:fixed;z-index:2;left:50%;bottom:20px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);gap:12px;align-items:center;background:rgba(15,16,20,.9);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 16px;color:var(--muted);font-size:14px}
body.wallmode #wallui{display:flex}
.wall-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--muted)}
</style>
</head>
<body>
<div id="wall" aria-label="Стена постеров"></div>
<div id="wallui"><span>Тяните, чтобы листать. Нажмите на постер, чтобы открыть IMDb.</span><button class="btn" id="toList">К рейтингу</button></div>
<div class="wrap">
  <header>
    <h1 id="site"></h1>
    <div class="tools"><button class="btn ghost" id="toWall">Стена постеров</button><div class="who" id="who"></div></div>
  </header>
  <p class="sub">Рейтинг IMDb и оценки участников нашего сервера Discord.</p>
  <div id="msg"></div>
  <div id="adminBox"></div>
  <div class="bar">
    <label>Сортировка:
      <select id="sort">
        <option value="srv">по оценке сервера</option>
        <option value="imdb">по IMDb</option>
        <option value="diff">по разнице (сервер − IMDb)</option>
        <option value="new">сначала новые</option>
      </select>
    </label>
  </div>
  <div id="grid" class="grid"></div>
</div>
<script>
const SITE = 'Кинокружок';
const $ = s => document.querySelector(s);
const h = (t, a = {}, ...k) => {
  const e = document.createElement(t);
  for (const [n, v] of Object.entries(a)) {
    if (n === 'class') e.className = v;
    else if (n.startsWith('on')) e.addEventListener(n.slice(2), v);
    else if (v != null && v !== false) e.setAttribute(n, v);
  }
  e.append(...k.filter(x => x != null));
  return e;
};
const api = async (url, method = 'GET', body) => {
  const r = await fetch(url, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Ошибка');
  return d;
};
const fmt = n => n == null ? '—' : n.toFixed(1).replace('.', ',');
let me = null, films = [];

function say(text) { $('#msg').replaceChildren(text ? h('div', { class: 'msg' }, text) : ''); }

function renderWho() {
  $('#who').replaceChildren(me
    ? h('span', {}, me.name)
    : h('a', { class: 'btn', href: '/auth/login' }, 'Войти через Discord'),
    ...(me ? [h('a', { href: '/auth/logout' }, 'Выйти')] : []));
}

function renderAdmin() {
  if (!me || !me.admin) { $('#adminBox').replaceChildren(); return; }
  const input = h('textarea', { rows: 2, placeholder: 'IMDb ID или ссылки на фильмы. Можно вставить сразу весь список.' });
  const run = async fn => { try { say(await fn()); await load(); } catch (e) { say(e.message); } };
  $('#adminBox').replaceChildren(h('div', { class: 'admin' }, input,
    h('button', { class: 'btn', onclick: () => run(async () => {
      const ids = [...new Set(input.value.match(/tt\d{7,9}/g) || [])];
      if (!ids.length) throw new Error('Не нашёл ни одного IMDb ID вида tt0111161');
      let added = 0, skipped = 0; const failed = [];
      for (let i = 0; i < ids.length; i += 20) {
        say(`Добавляю… ${i} из ${ids.length}`);
        const d = await api('/api/films', 'POST', { imdbId: ids.slice(i, i + 20).join(' ') });
        added += d.added; skipped += d.skipped; failed.push(...d.failed);
      }
      input.value = '';
      return `Добавлено: ${added}` + (skipped ? `, уже были: ${skipped}` : '') + (failed.length ? `, не найдено: ${failed.length} (${failed.slice(0, 5).join(', ')}${failed.length > 5 ? '…' : ''})` : ''); }) }, 'Добавить фильм'),
    h('button', { class: 'btn ghost', onclick: () => run(async () => {
      const d = await api('/api/films/refresh', 'POST'); return 'Рейтинги IMDb обновлены: ' + d.updated; }) }, 'Обновить рейтинги IMDb')));
}

function render() {
  const m = $('#sort').value, list = [...films];
  const key = f => m === 'imdb' ? f.imdb ?? -1 : m === 'diff' ? (f.srv == null || f.imdb == null ? -99 : f.srv - f.imdb) : f.srv ?? -1;
  if (m !== 'new') list.sort((a, b) => key(b) - key(a));
  if (!list.length) { $('#grid').replaceChildren(h('div', { class: 'empty' }, me?.admin ? 'Добавьте первый фильм по IMDb ID.' : 'Фильмов пока нет.')); return; }
  $('#grid').replaceChildren(...list.map(f => {
    const btns = [];
    for (let i = 1; i <= 10; i++) btns.push(h('button', {
      class: f.mine === i ? 'on' : '', disabled: !me,
      onclick: async () => { try { await api('/api/rate', 'POST', { filmId: f.id, score: f.mine === i ? null : i }); await load(); } catch (e) { say(e.message); } }
    }, String(i)));
    return h('div', { class: 'card' },
      f.poster ? h('img', { class: 'poster', src: f.poster, alt: '', loading: 'lazy', referrerpolicy: 'no-referrer' }) : h('div', { class: 'poster' }),
      h('div', {},
        h('h2', {}, f.title), h('div', { class: 'year' }, f.year || ''),
        h('div', { class: 'scores' },
          h('div', { class: 's imdb' }, h('b', {}, fmt(f.imdb)), h('small', {}, 'IMDb')),
          h('div', { class: 's srv' }, h('b', {}, fmt(f.srv)), h('small', {}, `Сервер, оценок: ${f.n}`))),
        h('div', { class: 'vote' }, ...btns),
        h('div', { class: 'hint' }, me ? (f.mine ? `Ваша оценка: ${f.mine}. Нажмите на неё ещё раз, чтобы убрать.` : 'Выберите оценку от 1 до 10') : 'Войдите через Discord, чтобы оценить'),
        me?.admin ? h('button', { class: 'del', onclick: async () => { if (confirm('Удалить «' + f.title + '» вместе с оценками?')) { await api('/api/films/' + f.id, 'DELETE'); await load(); } } }, 'Удалить фильм') : null));
  }));
}

async function load() { films = await api('/api/films'); render(); Wall.set(films); }

const Wall = (() => {
  const root = $('#wall'), G = 12, C = 7;
  let list = [], key = '', ox = 0, oy = 0, vx = 0, vy = 0, drag = null, moved = 0, suppress = false;
  let inner = null, cols = [], colStep = 1, P = 1, timer = 0;
  const mod = (a, n) => ((a % n) + n) % n;
  const capNodes = f => [h('b', {}, f.title), h('br'), `IMDb ${fmt(f.imdb)} · Сервер ${fmt(f.srv)}`];
  function poster(f, w, ph) {
    return h('a', { class: 'p', href: 'https://www.imdb.com/title/' + encodeURIComponent(f.id) + '/', target: '_blank', rel: 'noopener', draggable: 'false', 'data-id': f.id, style: `width:${w}px;height:${ph}px` },
      f.poster ? h('img', { src: f.poster, alt: f.title, loading: 'lazy', draggable: 'false', referrerpolicy: 'no-referrer' }) : h('span', { class: 'nop' }, f.title),
      h('span', { class: 'cap' }, ...capNodes(f)));
  }
  // Стена бесконечная: колонки повторяются по горизонтали, каждая колонка зациклена по вертикали
  function build() {
    root.replaceChildren(); cols = []; inner = null;
    if (!list.length) { root.append(h('div', { class: 'wall-empty' }, 'Здесь появятся постеры фильмов, как только их добавят на сайт.')); return; }
    const W = innerWidth, H = innerHeight, cw = W < 700 ? 140 : 210, ph = Math.round(cw * 1.5), step = ph + G;
    colStep = cw + G;
    const k = Math.max(Math.ceil(list.length / C), Math.ceil(H / step) + 1);
    P = k * step;
    const cy = Math.ceil(H / P) + 1, cx = Math.ceil(W / (C * colStep)) + 1;
    inner = h('div', { class: 'wall-in' });
    for (let x = 0; x < cx * C; x++) {
      const c = x % C, strip = h('div', { class: 'strip' });
      for (let r = 0; r < cy * k; r++) strip.append(poster(list[(c + (r % k) * C) % list.length], cw, ph));
      const col = h('div', { class: 'wcol', style: `left:${x * colStep}px;width:${cw}px` }, strip);
      cols.push({ el: col, phase: ((c * 7919) % 100) / 100 * step });
      inner.append(col);
    }
    root.append(inner); paint();
  }
  function paint() {
    if (!inner) return;
    inner.style.transform = `translate3d(${-mod(ox, C * colStep)}px,0,0)`;
    for (const c of cols) c.el.style.transform = `translate3d(0,${mod(-oy + c.phase, P) - P}px,0)`;
  }
  function tick() {
    if (!drag && (Math.abs(vx) > .1 || Math.abs(vy) > .1)) { ox += vx; oy += vy; vx *= .94; vy *= .94; paint(); }
    requestAnimationFrame(tick);
  }
  root.addEventListener('pointerdown', e => { if (e.button) return; drag = { x: e.clientX, y: e.clientY }; moved = 0; vx = vy = 0; });
  root.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
    moved += Math.abs(dx) + Math.abs(dy);
    if (moved > 6) { if (!root.hasPointerCapture(e.pointerId)) root.setPointerCapture(e.pointerId); root.classList.add('drag'); }
    ox -= dx; oy -= dy; vx = -dx; vy = -dy; paint();
  });
  const end = () => { if (!drag) return; drag = null; root.classList.remove('drag'); suppress = moved > 6; setTimeout(() => { suppress = false; }, 60); };
  root.addEventListener('pointerup', end);
  root.addEventListener('pointercancel', end);
  root.addEventListener('click', e => { if (suppress) { e.preventDefault(); e.stopPropagation(); } }, true);
  root.addEventListener('wheel', e => {
    if (!document.body.classList.contains('wallmode')) return;
    e.preventDefault(); ox += e.deltaX; oy += e.deltaY; paint();
  }, { passive: false });
  const mode = on => document.body.classList.toggle('wallmode', on);
  $('#toWall').addEventListener('click', () => mode(true));
  $('#toList').addEventListener('click', () => mode(false));
  addEventListener('keydown', e => { if (e.key === 'Escape') mode(false); });
  addEventListener('resize', () => { clearTimeout(timer); timer = setTimeout(build, 250); });
  requestAnimationFrame(tick);
  function set(films) {
    list = films.filter(f => f.id);
    const k = list.map(f => f.id).join();
    if (k !== key) { key = k; build(); return; }
    const by = Object.fromEntries(list.map(f => [f.id, f]));
    root.querySelectorAll('.p').forEach(a => { const f = by[a.dataset.id]; if (f) a.querySelector('.cap').replaceChildren(...capNodes(f)); });
  }
  return { set };
})();

(async () => {
  $('#site').textContent = '🎬 ' + SITE;
  $('#sort').addEventListener('change', render);
  const err = new URLSearchParams(location.search).get('error');
  if (err === 'notmember') say('Оценивать могут только участники нашего сервера Discord. Вступите на сервер и войдите снова.');
  else if (err === 'login') say('Не удалось войти через Discord. Попробуйте ещё раз.');
  if (err) history.replaceState(null, '', '/');
  try { me = await api('/api/me'); } catch {}
  renderWho(); renderAdmin();
  try { await load(); } catch (e) { say(e.message); }
})();
</script>
</body>
</html>
